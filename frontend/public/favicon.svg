  <rect x="5" y="11" width="18" height="14" rx="3" fill="url(#lg-main)" filter="url(#glow)" opacity="0.9" />
  <circle cx="14" cy="18" r="4.5" fill="#0B0F19" />
  <circle cx="14" cy="18" r="3" fill="url(#lg-main)" opacity="0.7" />
